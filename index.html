<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANAGTA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* VIDEO BACKGROUND */
.video-container {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
}

.video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* OVERLAY */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(10,10,10,0.65);
    z-index: -1;
}

/* NAVBAR */
.navbar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 25px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    z-index: 2;
}

.logo {
    font-weight: 600;
    letter-spacing: 3px;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
}

.nav-right {
    display: flex;
    gap: 20px;
    align-items: center;
}

.nav-right i {
    cursor: pointer;
}

/* CENTER CONTENT */
.content {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    color: white;
}

/* BRAND */
.brand {
    font-size: 4rem;
    letter-spacing: 12px;
    opacity: 0;
    animation: fadeUp 1.5s ease forwards;
}

.tagline {
    margin-top: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 1.5s ease forwards;
    animation-delay: 0.5s;
}

.btn {
    margin-top: 40px;
    padding: 12px 30px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
    opacity: 0;
    animation: fadeUp 1.5s ease forwards;
    animation-delay: 1s;
}

.btn:hover {
    background: white;
    color: black;
}

/* SOCIAL ICONS (LEFT SIDE) */
.social {
    position: absolute;
    left: 40px;
    bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.social i {
    color: white;
    cursor: pointer;
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */
@media(max-width:768px) {
    .nav-links {
        display: none;
    }

    .brand {
        font-size: 2.5rem;
        letter-spacing: 6px;
    }
}
</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-container">
    <video autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>
</div>

<div class="overlay"></div>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">ANAGTA</div>

    <div class="nav-links">
        <a href="#">HOME</a>
        <a href="#">PRODUCTS</a>
        <a href="#">CONTACT</a>
    </div>

    <div class="nav-right">
        <i class="fas fa-search"></i>
        <i class="fab fa-instagram"></i>
    </div>
</div>

<!-- CENTER -->
<div class="content">
    <div class="brand">ANAGTA</div>
    <div class="tagline">Objects That Hold Silence</div>
    <a href="#" class="btn">ENTER</a>
</div>

<!-- SOCIAL -->
<div class="social">
    <i class="fab fa-instagram"></i>
    <i class="fab fa-pinterest"></i>
</div>

</body>
</html>
