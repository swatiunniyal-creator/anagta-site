<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANAGTA</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:black;
}

/* VIDEO BACKGROUND */

.video-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-3;
    overflow:hidden;
}

.video-container video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.05);
}

/* OVERLAY */

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.72)
    );
    z-index:-2;
}

/* NAVBAR */

.navbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:28px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo img{
    width:52px;
    height:52px;
    object-fit:contain;
}

.logo-text{
    color:white;
    font-size:1rem;
    font-weight:300;
    letter-spacing:8px;
}

/* NAVIGATION */

.nav-links{
    display:flex;
    gap:35px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:2px;
    position:relative;
    transition:0.3s;
}

.nav-links a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-7px;
    width:0%;
    height:1px;
    background:white;
    transition:0.4s;
}

.nav-links a:hover::after{
    width:100%;
}

/* RIGHT ICONS */

.nav-right{
    display:flex;
    align-items:center;
    gap:22px;
}

.nav-right a{
    color:white;
}

.nav-right i{
    font-size:1rem;
    transition:0.3s;
}

.nav-right i:hover{
    opacity:0.7;
}

/* CENTER CONTENT */

.content{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    z-index:5;
}

/* BRAND */

.brand{
    font-family:'Cormorant Garamond',serif;
    font-size:6rem;
    font-weight:300;
    letter-spacing:18px;
    text-transform:uppercase;
    opacity:0;
    animation:fadeUp 1.5s ease forwards;
    text-shadow:0 0 25px rgba(255,255,255,0.08);
}

/* TAGLINE */

.tagline{
    margin-top:14px;
    color:#d6d6d6;
    font-size:0.9rem;
    letter-spacing:4px;
    font-weight:300;
    opacity:0;
    animation:fadeUp 1.5s ease forwards;
    animation-delay:0.5s;
}

/* BUTTON */

.btn{
    margin-top:42px;
    padding:14px 34px;
    border:1px solid rgba(255,255,255,0.8);
    color:white;
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:3px;
    transition:0.4s;
    opacity:0;
    animation:fadeUp 1.5s ease forwards;
    animation-delay:1s;
    backdrop-filter:blur(5px);
}

.btn:hover{
    background:white;
    color:black;
}

/* SIDE TEXT */

.side-text{
    position:absolute;
    right:60px;
    top:50%;
    transform:translateY(-50%);
    text-align:right;
    z-index:5;
}

.side-text div{
    margin:12px 0;
    color:#d8d8d8;
    font-size:0.8rem;
    font-weight:300;
    letter-spacing:3px;
}

/* SOCIAL ICONS */

.social{
    position:absolute;
    left:50px;
    bottom:40px;
    display:flex;
    flex-direction:column;
    gap:18px;
    z-index:5;
}

.social a{
    color:white;
    font-size:1rem;
    transition:0.3s;
}

.social a:hover{
    opacity:0.7;
}

/* ANIMATION */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE */

@media(max-width:768px){

    .navbar{
        padding:22px 25px;
    }

    .nav-links{
        display:none;
    }

    .side-text{
        display:none;
    }

    .brand{
        font-size:3rem;
        letter-spacing:8px;
    }

    .logo-text{
        display:none;
    }

    .logo img{
        width:42px;
        height:42px;
    }

}

</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->

<div class="video-container">

    <video autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>

</div>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- NAVBAR -->

<div class="navbar">

    <!-- LOGO -->

    <div class="logo">

        <img src="logo.png" alt="ANAGTA Logo">

        <div class="logo-text">
            ANAGTA
        </div>

    </div>

    <!-- NAVIGATION -->

    <div class="nav-links">

        <a href="index.html">HOME</a>

        <a href="products.html">PRODUCTS</a>

        <a href="contact.html">CONTACT</a>

    </div>

    <!-- RIGHT SIDE -->

    <div class="nav-right">

        <a href="#">
            <i class="fas fa-search"></i>
        </a>

        <a href="https://instagram.com" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

    </div>

</div>

<!-- SIDE CATEGORY TEXT -->

<div class="side-text">

    <div>SCULPTURAL LIGHTING</div>

    <div>METAL WORK</div>

    <div>GLASS OBJECTS</div>

    <div>LUXURY INTERIORS</div>

</div>

<!-- CENTER CONTENT -->

<div class="content">

    <div class="brand">
        ANAGTA
    </div>

    <div class="tagline">
        OBJECTS THAT HOLD SILENCE
    </div>

    <a href="products.html" class="btn">
        ENTER
    </a>

</div>

<!-- SOCIAL -->

<div class="social">

    <a href="https://instagram.com" target="_blank">
        <i class="fab fa-instagram"></i>
    </a>

    <a href="#">
        <i class="fab fa-pinterest"></i>
    </a>

</div>

</body>
</html>
